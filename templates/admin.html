<div class="admin-container">
    <h2>All Appointments <a href="/logout" style="float:right; font-size:14px;">Logout</a></h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Patient Name</th>
                <th>Phone</th>
                <th>Date</th>
                <th>Message</th>
                <th>Action</th>
                <th>age</th>
                <th>status</th>
            </tr>
        </thead>
        <tbody>
           {% for appt in data %}
<tr>
    <td>{{ appt[0] }}</td> <td>{{ appt[1] }}</td> <td>{{ appt[2] }}</td> <td>
        <span class="status-badge {{ appt[5]|lower }}">
            {{ appt[5] }}
        </span>
    </td>
    
    <td>
        {% if appt[5] == 'Pending' %}
            <a href="/approve/{{ appt[0] }}" class="btn-approve">✔️ Approve</a>
        {% elif appt[5] == 'Approved' %}
            <a href="/complete/{{ appt[0] }}" class="btn-complete">🩺 Complete</a>
        {% endif %}
        
        <a href="/delete/{{ appt[0] }}" onclick="return confirm('Mita dein?')" class="btn-delete">❌ Delete</a>
    </td>
</tr>
{% endfor %}
        </tbody>
    </table>
</div>
